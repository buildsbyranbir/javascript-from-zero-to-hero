<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Functions</h1>
<h2>Arrow Functions</h2>

<p>This example shows the normal syntax of a function expression, without the use of arrow function syntax.</p>

<p id="demo"></p>

<script>
let hello = function() {return "Hello World!";}

document.getElementById("demo").innerHTML = hello();
</script>

</body>
</html>
