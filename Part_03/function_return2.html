<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Functions</h1>
<p>Returned function values are often used to update HTML content.</p>

<p id="demo"></p>

<script>
function toCelsius(farenheit) {
  return (5/9) * (farenheit-32);
}

document.getElementById("demo").innerHTML = toCelsius(77);
</script>

</body>
</html>
