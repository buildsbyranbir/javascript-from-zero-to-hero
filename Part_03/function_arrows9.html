<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Functions</h1>
<h2>Arrow Functions</h2>

<p>If you have only one parameter in an Arrow Function, you can skip the parentheses.</p>

<p id="demo"></p>

<script>
let hello = val => "Hello " + val;

document.getElementById("demo").innerHTML = hello("Universe!");
</script>

</body>
</html>
